[package]
name = "slicer-router-app"
description = "Slicer Router: opens .3mf files in the slicer that made them."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# Tauri 2 and its plugins declare 1.90; core and the CLI only need 1.88.
rust-version = "1.90"
default-run = "slicer-router-app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
slicer-router-core.workspace = true
base64 = "0.23"
serde.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

