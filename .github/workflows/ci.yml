name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core and cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude slicer-router-app --all-targets -- -D warnings
      - run: cargo test --workspace --exclude slicer-router-app

  app:
    name: tauri app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: app
          - os: windows-latest
            bundle: nsis
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p slicer-router-app --all-targets -- -D warnings
      - run: cargo test -p slicer-router-app
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri build --bundles ${{ matrix.bundle }}
        working-directory: app/src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: slicer-router-${{ matrix.os }}
          path: |
            target/release/bundle/macos/*.app
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
