name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: 2.9.6

jobs:
  core:
    name: core and cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude slicer-router-app --all-targets -- -D warnings
      - run: cargo test --workspace --exclude slicer-router-app

  msrv:
    name: core and cli on the declared minimum Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p slicer-router-core -p slicer-router-cli -p slicer-router-ffi --all-targets --locked

  app:
    name: tauri app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: SlicerRouter-*-arm64.zip
          - os: windows-latest
            artifact: target/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p slicer-router-app --all-targets -- -D warnings
      - run: cargo test -p slicer-router-app
      - name: Restore tauri-cli
        id: tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri${{ runner.os == 'Windows' && '.exe' || '' }}
          key: tauri-cli-${{ env.TAURI_CLI_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install tauri-cli
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}" --locked
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        run: cargo tauri build --bundles nsis
        working-directory: app/src-tauri
      - name: Build the macOS app with its thumbnail extension, signed ad hoc
        if: runner.os == 'macOS'
        run: scripts/build-macos.sh --no-sign --out .
      - name: Check the thumbnail extension is embedded and sandboxed
        if: runner.os == 'macOS'
        run: |
          app="target/aarch64-apple-darwin/release/bundle/macos/Slicer Router.app"
          appex="$app/Contents/PlugIns/SlicerRouterThumbnail.appex"
          test -x "$appex/Contents/MacOS/SlicerRouterThumbnail"
          plutil -lint "$app/Contents/Info.plist" "$appex/Contents/Info.plist"
          codesign --verify --deep --strict "$app"
          codesign -d --entitlements - "$appex" | grep -q com.apple.security.app-sandbox
      - uses: actions/upload-artifact@v4
        with:
          name: slicer-router-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
