[workspace]
resolver = "2"
members = [
    "crates/slicer-router-core",
    "crates/slicer-router-cli",
    "crates/slicer-router-ffi",
    "app/src-tauri",
]
default-members = [
    "crates/slicer-router-core",
    "crates/slicer-router-cli",
    "crates/slicer-router-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/PrintHive/slicer-router"
# Consumed as a git dependency, never published to crates.io.
publish = false
# What the core and CLI crates need (their dependency `zip` requires 1.88). The
# app sets its own, higher value because Tauri 2 requires 1.90.
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
quick-xml = "0.42"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
slicer-router-core = { path = "crates/slicer-router-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
